<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>שבעת העקרונות — המסע הזוגי שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E8;
    --bg-alt:#EFE7D8;
    --card:#FFFDF8;
    --navy:#1F2A44;
    --navy-soft:#3A4766;
    --gold:#C9A227;
    --gold-soft:#E4C878;
    --text:#2B2620;
    --muted:#8a8272;
    --line:#E3D9C4;
    --shadow: 0 8px 24px rgba(43,38,32,0.10);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  img{max-width:100%; display:block;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-alt), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Heebo',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
    line-height:1.65;
  }
  h1,h2{ font-family:'Frank Ruhl Libre', serif; }
  .wrap{ max-width:520px; margin:0 auto; padding:16px 16px 8px; }

  a.back-link{
    display:inline-block;
    color:var(--navy-soft);
    text-decoration:none;
    font-size:14px;
    margin-bottom:10px;
  }
  a.back-link:hover{ text-decoration:underline; }

  /* PROGRESS */
  .progress-wrap{ margin-bottom:14px; display:none; }
  .progress-wrap.show{ display:block; }
  .progress-label{
    display:flex; justify-content:space-between;
    font-size:12px; color:var(--muted); margin-bottom:6px;
  }
  .progress-bar{
    height:6px; background:var(--line); border-radius:4px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--navy),var(--gold));
    border-radius:4px; transition:width .35s ease;
  }

  /* CARD */
  .card-screen{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px;
    text-align:center;
    border:1px solid rgba(43,38,32,0.05);
  }
  .card-screen .eyebrow{
    font-size:12px; letter-spacing:0.12em; color:var(--gold); font-weight:700; margin-bottom:8px;
  }
  .card-screen h1{ font-size:24px; margin:0 0 8px; color:var(--navy); }
  .card-screen h2{ font-size:20px; margin:0 0 6px; color:var(--navy); }
  .card-screen .tagline{ color:var(--muted); font-size:14.5px; margin:0 0 4px; }
  .card-screen p.body-text{ text-align:right; font-size:.96rem; margin:14px 0; }
  .card-screen p.body-text.center{ text-align:center; }

  .photo-slot{
    width:100%;
    aspect-ratio:16/10;
    border-radius:16px;
    border:2px dashed var(--line);
    background:var(--bg-alt);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    margin:0 0 16px;
    color:var(--muted);
    font-size:.8rem;
  }
  .photo-slot .icon{ font-size:2rem; }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; border-radius:14px; }

  .callout{
    background:var(--bg);
    border-right:4px solid var(--navy);
    border-radius:10px;
    padding:12px 16px;
    margin:14px 0;
    font-size:.88rem;
    text-align:right;
  }
  .callout.warn{ background:#FBEFE9; border-right-color:#B4534A; }
  .callout strong{ color:var(--navy); }

  .source-note{
    margin-top:16px;
    font-size:.75rem;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:12px;
  }

  /* BUTTONS */
  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .btn-row.row-inline{ flex-direction:row; }
  button.btn-primary{
    background:linear-gradient(135deg,var(--navy),var(--navy-soft));
    color:var(--gold-soft);
    border:none; border-radius:14px;
    padding:14px 20px; font-weight:700; font-size:.98rem;
    cursor:pointer; font-family:inherit;
  }
  button.btn-primary:active{ transform:scale(.98); }
  button.btn-secondary{
    background:var(--bg);
    color:var(--navy);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 18px; font-weight:600; font-size:.9rem;
    cursor:pointer; font-family:inherit;
  }
  a.btn-back-text{
    display:block; text-align:center; color:var(--muted);
    font-size:.85rem; text-decoration:none; margin-top:12px;
    cursor:pointer;
  }
  a.btn-back-text:hover{ text-decoration:underline; }

  /* GAME WIDGETS */
  .prompt-box{
    background:linear-gradient(135deg,var(--navy),var(--navy-soft));
    color:var(--gold-soft);
    border-radius:16px;
    padding:20px 18px;
    font-size:1.05rem;
    font-weight:600;
    margin:12px 0;
    min-height:60px;
    display:flex; align-items:center; justify-content:center;
  }
  .reveal-box{
    background:var(--gold-soft);
    color:var(--navy);
    border-radius:14px;
    padding:14px 16px;
    font-size:.9rem;
    margin:12px 0;
    display:none;
    text-align:right;
  }
  .reveal-box.show{ display:block; }

  .choice-list{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .choice-opt{
    text-align:right;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    font-size:.9rem;
    font-family:inherit;
    color:var(--text);
  }
  .choice-opt.picked{ border-color:var(--gold); background:var(--gold-soft); font-weight:700; }

  textarea.soft-input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-family:inherit;
    font-size:.88rem;
    resize:vertical;
    min-height:44px;
    background:var(--bg);
    color:var(--text);
    margin-bottom:10px;
  }
  .field-label{ text-align:right; font-size:.82rem; color:var(--navy-soft); font-weight:700; margin:10px 0 4px; }

  .step-list{ text-align:right; margin:14px 0; padding:0; list-style:none; counter-reset:st; }
  .step-list li{
    counter-increment:st;
    position:relative;
    padding-inline-start:34px;
    margin-bottom:12px;
    font-size:.9rem;
  }
  .step-list li:before{
    content:counter(st);
    position:absolute; right:0; top:0;
    width:24px;height:24px;border-radius:50%;
    background:var(--navy); color:#fff;
    font-size:.75rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  .meaning-cats{ text-align:right; margin:14px 0; }
  .meaning-cats .cat{ margin-bottom:12px; }
  .meaning-cats .cat .cat-title{ font-weight:700; color:var(--navy); font-size:.9rem; }
  .meaning-cats .cat .cat-q{ color:var(--muted); font-size:.85rem; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; justify-content:center; }
  .chip{
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
    font-size:.82rem;
    cursor:pointer;
    font-family:inherit;
    color:var(--text);
  }
  .chip.picked{ background:var(--navy); border-color:var(--navy); color:var(--gold-soft); font-weight:700; }
  .sentence-preview{
    background:var(--gold-soft);
    border-radius:14px;
    padding:16px;
    font-size:.95rem;
    font-weight:600;
    color:var(--navy);
    margin:10px 0 4px;
    min-height:50px;
  }

  .followup-list{ text-align:right; margin:14px 0; padding:0; list-style:none; }
  .followup-list li{
    background:var(--bg);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:8px;
    font-size:.88rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="tikshoret.html">→ חזרה לכלים לתקשורת זוגית</a>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label"><span id="progressText"></span><span>❤️</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="screenContainer"></div>

</div>

<script>
/* ---------- content data ---------- */

const STATIONS = [
  {
    icon:"🗺️", key:"map", photo:"../media/images/gottman-map.jpeg",
    title:"מפת האהבה", principle:"Enhance Your Love Maps",
    tagline:"כמה אנחנו באמת מכירים?",
    explain:`גוטמן גילה שזוגות שמצליחים לשמור על קשר טוב לאורך זמן, ממשיכים כל הזמן לעדכן את מה שהוא מכנה "מפת האהבה" — ההיכרות המתמשכת עם העולם הפנימי של בן/בת הזוג. לא מספיק לדעת מה הוא אוהב לאכול; חשוב להכיר גם מה מעסיק אותו עכשיו, מה מלחיץ אותו, מה החלומות שלו, ומי האנשים המשמעותיים בחייו כרגע. מפת האהבה משתנה עם הזמן — מה שהיה נכון לפני שנה, לא בהכרח נכון היום. במשחק הבא תבדקו כמה אתם מעודכנים במפה של בן/בת הזוג שלכם, ותגלו דבר אחד חדש עליו/ה.`,
    followups:[
      "יש עוד תחום בחיים של בן/בת הזוג שהיית רוצה לדעת עליו יותר?",
      "מה עוזר לכם לעדכן את \"מפת האהבה\" בתוך שגרה עמוסה?",
      "מתי לאחרונה גיליתם משהו חדש אחד על השני?"
    ]
  },
  {
    icon:"❤️", key:"fondness", photo:"../media/images/gottman-fondness.jpeg",
    title:"חיבה והערצה", principle:"Nurture Your Fondness and Admiration",
    tagline:"לראות את הטוב",
    explain:`אחד הדברים שגוטמן מצא אצל זוגות יציבים הוא הרגל של שמירה על חיבה והערכה — גם בתוך שגרה, עומס וימים לא קלים. זה לא אומר שאין חילוקי דעות, אלא שברקע נשארת תחושה בסיסית של כבוד וחיבה כלפי בן/בת הזוג. לפי גוטמן, זוגות שמצליחים לשמר את התחושה הזו מתמודדים טוב יותר גם עם קונפליקטים, כי יש להם "רזרבה" של רגשות חיוביים לחזור אליה. במשחק הבא תתרגלו להביע חיבה והערכה בצורה ספציפית ואמיתית — לא סתם "אתה מדהים", אלא באמת למה.`,
    followups:[
      "יש תכונה של בן/בת הזוג שאת/ה מעריך/ה יותר ככל שעובר הזמן?",
      "מתי לאחרונה הרגשת ממש מוערך/ת על ידי?",
      "יש הרגל קטן של בן/בת הזוג שהיית רוצה שיידע/תדע שאת/ה שם/ה לב אליו?"
    ]
  },
  {
    icon:"👋", key:"turn", photo:"../media/images/gottman-turn.jpeg",
    title:"לפנות זה אל זה", principle:"Turn Toward Each Other Instead of Away",
    tagline:"הזמנות קטנות לחיבור",
    explain:`גוטמן מתאר איך במהלך היום אנחנו כל הזמן שולחים אחד לשני "הזמנות קטנות לחיבור" — הערה, שאלה, בקשה לתשומת לב. "תראה מה מצאתי", "את יודעת מה קרה לי?", "תקשיבי, אני חייב לספר לך משהו". התגובה שלנו לרגעים הקטנים האלה, יותר מכל שיחה גדולה, היא מה שבונה או שוחק את הקשר לאורך זמן. זוגות שפונים זה אל זה ברוב הפעמים — גם בתגובה קצרה וטבעית — נוטים לשמור על קשר חזק יותר. במשחק הבא נבחן איך זה מרגיש מהצד השני, ואיך אתם יכולים לפנות זה אל זה בצורה שתרגיש הכי נכונה.`,
    followups:[
      "אחת הדרכים הקטנות שבהן אני מבקש/ת ממך תשומת לב היא...",
      "כשאתה פונה אליי בצורה כזו, הכי נעים לי כשאתה...",
      "יש רגע שבו הרגשת שפנית ולא קיבלת תשומת לב? (בלי כעס — סתם לשתף)"
    ]
  },
  {
    icon:"🤝", key:"influence", photo:"../media/images/gottman-influence.jpeg",
    title:"לתת מקום להשפעה", principle:"Let Your Partner Influence You",
    tagline:"לא חייבים תמיד לנצח בוויכוח",
    explain:`עיקרון מרכזי אצל גוטמן הוא לתת מקום להשפעה של בן/בת הזוג — להיות פתוחים באמת לשקול את נקודת המבט של השני, גם כשהיא שונה משלכם. זה לא אומר לוותר תמיד. זוגות שמתקשים לתת מקום להשפעה נוטים להיתקע בוויכוחים חוזרים, כי אף אחד לא מרגיש נשמע. במשחק הבא תתרגלו רגע קטן של "להחליף צדדים" — לא כדי להחליט מי צודק, אלא כדי לתרגל סקרנות אמיתית כלפי מה שהצד השני רואה.`,
    followups:[
      "באילו נושאים קל לי לקבל את דעתך?",
      "באילו נושאים קשה לי יותר?",
      "מתי לאחרונה שינית את דעתי בעקבות משהו שאמרת?",
      "מה עוזר לי להרגיש שהדעה שלי נלקחת ברצינות?"
    ]
  },
  {
    icon:"🛠️", key:"solve", photo:"../media/images/gottman-solve.jpeg",
    title:"לפתור את מה שאפשר לפתור", principle:"Solve Your Solvable Problems",
    tagline:"משדרגים תלונה לבקשה",
    explain:`לא כל בעיה זוגית זהה. גוטמן מבחין בין בעיות שאפשר לפתור לבין הבדלים עמוקים יותר שחוזרים על עצמם. בתחנה הזו נתמקד בבעיות הפתירות — הקטנות, היומיומיות. אחד הכלים המרכזיים שלו הוא להפוך תלונה חריפה ("אתה אף פעם לא...") לבקשה רכה וברורה, שמתארת מה קרה, מה אני מרגיש/ה, ומה הייתי רוצה. בקשה כזו הרבה יותר קל לשמוע ולהיענות לה מאשר האשמה כללית. במשחק הבא תתרגלו יחד לשדרג משפט ביקורתי לבקשה שאפשר לפעול לפיה.`,
    followups:[
      "יש עוד \"תלונה\" קטנה שהיית רוצה לשדרג לבקשה?",
      "מה הכי עוזר לך לשמוע בקשה בלי להרגיש מותקף/ת?",
      "יש הבדל בינינו בקצב שבו אנחנו פותרים דברים כאלה?"
    ]
  },
  {
    icon:"🧩", key:"gridlock", photo:"../media/images/gottman-gridlock.jpeg",
    title:"כשאין פתרון פשוט", principle:"Overcome Gridlock",
    tagline:"להבין, לא לשכנע",
    explain:`לא כל דבר ניתן לפתור, וזה בסדר. גוטמן מזהה שיש נושאים שחוזרים שוב ושוב בין בני זוג — לא כי אחד מהם "לא מבין", אלא כי מאחורי העמדה שלו יש ערך, חלום או צורך עמוק יותר. המטרה בתחנה הזו איננה לפתור את הנושא או לשכנע את הצד השני, אלא פשוט להבין אותו טוב יותר. זה שינוי גישה משמעותי: מ"איך אני משכנע אותך" ל"מה עומד מאחורי מה שאתה מרגיש". זהו אחד הכלים החזקים ביותר להתמודדות עם הבדלים שלא הולכים להיעלם.`,
    followups:[
      "מה גילית עכשיו על הצד שלך שלא היה לך ברור קודם?",
      "מה גילית על הצד של בן/בת הזוג שהפתיע אותך?",
      "איך זה מרגיש לדעת שלא חייבים לפתור הכול כדי להיות בסדר?"
    ]
  },
  {
    icon:"🏡", key:"meaning", photo:"../media/images/gottman-meaning.jpeg",
    title:"ליצור משמעות משותפת", principle:"Create Shared Meaning",
    tagline:"הבית שאנחנו בונים",
    explain:`התחנה האחרונה עוסקת במה שגוטמן מכנה "יצירת משמעות משותפת" — העולם הזוגי הייחודי שאתם בונים יחד: הטקסים הקטנים שלכם, המטרות המשותפות, הערכים שחשובים לכם כבית, והחלומות שאתם רוצים להגשים ביחד. זה מה שהופך שני אנשים לבית אחד. אין תשובה נכונה — יש רק את הבית שאתם בוחרים לבנות. בתחנה הזו תתחילו לנסח יחד, במילים שלכם, איך נראה הבית שאתם רוצים.`,
    followups:[
      "יש טקס קטן שכבר יש לכם, גם אם לא קראתם לו ככה?",
      "מה היה חסר לכם בבית שגדלתם בו, שהייתם רוצים שיהיה בבית שלכם?",
      "רוצים לכתוב את המשפט שיצרתם ביחד איפשהו ששניכם תראו מדי פעם?"
    ]
  }
];

const MAP_QUESTIONS = [
  "מה הדבר שהכי מלחיץ את בן/בת הזוג שלך בתקופה האחרונה?",
  "מי האדם המשמעותי במיוחד בחייו/ה כרגע?",
  "למה בן/בת הזוג שלך הכי מצפה/ה בזמן הקרוב?",
  "מהו אחד החלומות שלו/ה?",
  "מה הדבר שהיה רוצה/רוצה להשיג השנה?",
  "מהו משהו שהוא/היא היו רוצים לשנות בחיים?",
  "איזה דבר קטן יכול להפוך את היום שלו/ה לטוב יותר?",
  "מה השתנה אצל בן/בת הזוג שלך יותר מכל בשנה האחרונה?"
];

const FONDNESS_CARDS = [
  "משהו בך שאני מעריך/ה יותר ממה שאני אומר/ת.",
  "תכונה שלך שעזרה לי בתקופה האחרונה.",
  "משהו קטן שאתה עושה ואני אוהב/ת.",
  "רגע שבו הסתכלתי עליך לאחרונה וחשבתי: איזה כיף שאנחנו ביחד.",
  "משהו שאני חושב/ת שאתה ממש טוב בו.",

/* ---------- flow engine ---------- */

const container = document.getElementById('screenContainer');
const progressWrap = document.getElementById('progressWrap');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');

const STEPS = [];
STEPS.push({ kind:'intro' });
STATIONS.forEach((st, i)=>{
  STEPS.push({ kind:'open', si:i });
  STEPS.push({ kind:'explain', si:i });
  STEPS.push({ kind:'game', si:i });
  STEPS.push({ kind:'followup', si:i });
  STEPS.push({ kind:'close', si:i });
});
STEPS.push({ kind:'end' });

let stepIndex = 0;

function go(delta){
  stepIndex = Math.max(0, Math.min(STEPS.length-1, stepIndex+delta));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateProgress(si){
  if(si === undefined){ progressWrap.classList.remove('show'); return; }
  progressWrap.classList.add('show');
  progressText.textContent = `תחנה ${si+1} מתוך ${STATIONS.length}`;
  const pct = Math.round(((si+1)/STATIONS.length)*100);
  progressFill.style.width = pct + '%';
}

function sourceNote(){
  return `<div class="source-note">מבוסס על: "שבעת העקרונות לנישואים מוצלחים" מאת ג'ון גוטמן.</div>`;
}

function backLink(){
  if(stepIndex === 0) return '';
  return `<a class="btn-back-text" id="backBtn">→ חזרה</a>`;
}

function render(){
  const step = STEPS[stepIndex];
  let html = '';

  if(step.kind === 'intro'){
    updateProgress(undefined);
    html = `
      <div class="card-screen">
        <div class="eyebrow">כלים לתקשורת זוגית</div>
        <h1>שבעת העקרונות<br>המסע הזוגי שלנו</h1>
        <p class="body-text">המשחק מבוסס על שבעת העקרונות של ד"ר ג'ון גוטמן, מתוך הספר "שבעת העקרונות לנישואים מוצלחים".</p>
        <p class="body-text">גוטמן חקר במשך עשרות שנים זוגות, וניסה להבין אילו הרגלים וקשרים מאפיינים זוגות שמצליחים לשמור על קשר טוב לאורך זמן.</p>
        <p class="body-text"><strong>כאן לא נעשה מבחן, ולא ננסה "לדרג" את הזוגיות שלכם.</strong> במקום זאת, נעבור יחד שבע תחנות קצרות, עם משחקים ושאלות בהשראת הכלים של גוטמן. המטרה היא פשוט להכיר, לדבר וליהנות ביחד.</p>
        <div class="photo-slot"><img src="../media/images/gottman-intro.jpeg" alt="בני זוג יחד"></div>
        <div class="btn-row"><button class="btn-primary" id="nextBtn">מתחילים?</button></div>
      </div>`;
  }

  else if(step.kind === 'open'){
    const st = STATIONS[step.si];
    updateProgress(step.si);
    html = `
      <div class="card-screen">
        <div class="eyebrow">תחנה ${step.si+1} מתוך ${STATIONS.length}</div>
        <div class="photo-slot" data-station-photo="${st.key}">${st.photo ? `<img src="${st.photo}" alt="${st.title}">` : `<span class="icon">${st.icon}</span><span>תמונה תתווסף כאן</span>`}</div>
        <h2>${st.icon} ${st.title}</h2>
        <p class="tagline">${st.tagline}</p>
        <div class="btn-row"><button class="btn-primary" id="nextBtn">בואו נשחק</button></div>
        ${backLink()}
      </div>`;
  }

  else if(step.kind === 'explain'){
    const st = STATIONS[step.si];
    updateProgress(step.si);
    html = `
      <div class="card-screen">
        <div class="eyebrow">${st.principle}</div>
        <h2>${st.title}</h2>
        <p class="body-text">${st.explain}</p>
        <div class="btn-row"><button class="btn-primary" id="nextBtn">בואו נשחק</button></div>
        ${backLink()}
      </div>`;
  }

  else if(step.kind === 'game'){
    updateProgress(step.si);
    html = renderGame(step.si);
  }

  else if(step.kind === 'followup'){
    const st = STATIONS[step.si];
    updateProgress(step.si);
    html = `
      <div class="card-screen">
        <div class="eyebrow">להעמקה</div>
        <h2>עוד כמה שאלות</h2>
        <ul class="followup-list">
          ${st.followups.map(q=>`<li>${q}</li>`).join('')}
        </ul>
        <div class="btn-row"><button class="btn-primary" id="nextBtn">המשך</button></div>
        ${backLink()}
      </div>`;
  }

  else if(step.kind === 'close'){
    const st = STATIONS[step.si];
    const isLast = step.si === STATIONS.length-1;
    updateProgress(step.si);
    html = `
      <div class="card-screen">
        <div style="font-size:2.4rem;margin-bottom:6px;">✅</div>
        <h2>מעולה!</h2>
        <p class="body-text center">${isLast ? 'סיימתם את התחנה האחרונה.' : 'עכשיו אתם מוכנים לתחנה הבאה.'}</p>
        ${sourceNote()}
        <div class="btn-row"><button class="btn-primary" id="nextBtn">${isLast ? 'לסיום' : 'לתחנה הבאה'}</button></div>
        ${backLink()}
      </div>`;
  }

  else if(step.kind === 'end'){
    updateProgress(undefined);
    html = `
      <div class="card-screen">
        <div style="font-size:2.6rem;margin-bottom:6px;">❤️</div>
        <h2>סיימתם את שבע התחנות</h2>
        <p class="body-text center">עכשיו אתם מכירים קצת יותר זה את זו, דיברתם על דברים שאולי לא תמיד מגיעים אליהם ביום־יום, ובעיקר — הקדשתם זמן להיות יחד.</p>
        <p class="body-text center" style="font-weight:700;color:var(--navy);">רוצים לעשות עוד סיבוב?</p>
        <div class="btn-row">
          <button class="btn-primary" id="restartBtn">להתחיל מחדש</button>
          <a class="btn-secondary" href="tikshoret.html" style="text-decoration:none;text-align:center;display:block;">חזרה לכלים לתקשורת זוגית</a>
        </div>
        <div class="source-note" style="text-align:center;margin-top:20px;">
          רוצים להעמיק? הרעיונות במשחק מבוססים על הספר "שבעת העקרונות לנישואים מוצלחים" מאת ג'ון גוטמן ועל התרגילים הזוגיים הנלווים אליו. הספר מציע הרחבה משמעותית לכל אחד מהנושאים.
        </div>
      </div>`;
  }

  container.innerHTML = html;
  wireStep(step);
}

function wireStep(step){
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>go(1));
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>go(-1));
  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{ stepIndex = 0; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  if(step.kind === 'game') wireGame(step.si);
}

/* ---------- per-station games ---------- */

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let mapDeck = shuffle(MAP_QUESTIONS);
let fondnessDeck = shuffle(FONDNESS_CARDS);

function renderGame(si){
  const st = STATIONS[si];
  if(si === 0) return gameMapHtml();
  if(si === 1) return gameFondnessHtml();
  if(si === 2) return gameTurnHtml();
  if(si === 3) return gameInfluenceHtml();
  if(si === 4) return gameSolveHtml();
  if(si === 5) return gameGridlockHtml();
  if(si === 6) return gameMeaningHtml();
  return `<div class="card-screen"><p>...</p></div>`;
}

function wireGame(si){
  if(si === 0) wireGameMap();
  if(si === 1) wireGameFondness();
  if(si === 2) wireGameTurn();
  if(si === 3) wireGameInfluence();
  if(si === 4) wireGameSolve();
  if(si === 6) wireGameMeaning();
}

/* Station 1: Love Maps */
function gameMapHtml(){
  return `
    <div class="card-screen">
      <div class="eyebrow">משחק: כמה אתם מכירים?</div>
      <p class="body-text center">אחד מכם בוחר "אני מנחש/ת", והשני עונה בקול על השאלה שלמטה. אין תשובה נכונה — רק גילוי.</p>
      <div class="prompt-box" id="mapQ">${mapDeck[mapDeck.length-1] || ''}</div>
      <div class="reveal-box" id="mapReveal">מגניב. עכשיו אני יודע/ת עליך עוד משהו. <br><strong>לא מתקנים ולא שופטים</strong> — רק להקשיב.</div>
      <div class="btn-row">
        <button class="btn-secondary" id="mapRevealBtn">ניחשתי, בן/בת הזוג עונה עכשיו</button>
        <button class="btn-secondary" id="mapNextQBtn">שאלה נוספת</button>
        <button class="btn-primary" id="nextBtn">לתחנה הבאה</button>
      </div>
      ${backLink()}
    </div>`;
}
function wireGameMap(){
  if(mapDeck.length === 0) mapDeck = shuffle(MAP_QUESTIONS);
  document.getElementById('mapRevealBtn').addEventListener('click', ()=>{
    document.getElementById('mapReveal').classList.add('show');
  });
  document.getElementById('mapNextQBtn').addEventListener('click', ()=>{
    if(mapDeck.length <= 1) mapDeck = shuffle(MAP_QUESTIONS);
    else mapDeck.pop();
    document.getElementById('mapQ').textContent = mapDeck[mapDeck.length-1];
    document.getElementById('mapReveal').classList.remove('show');
  });
}

  document.getElementById('fondNextBtn').addEventListener('click', ()=>{
    if(fondnessDeck.length <= 1) fondnessDeck = shuffle(FONDNESS_CARDS);

/* Station 3: Turn Toward */
function gameTurnHtml(){
  const options = [
    "\"נו, מה קרה?\"",
    "\"רגע, אני באמצע משהו.\"",
    "\"עוד פעם אתה מתחיל עם העבודה?\""
  ];
  return `
    <div class="card-screen">
      <div class="eyebrow">משחק: מה הייתם עושים?</div>
      <div class="prompt-box">בן/בת הזוג חוזר/ת הביתה ואומר/ת:<br>"אתה לא מאמין איזה יום עבר עליי..."</div>
      <p class="body-text">איך הייתם מגיבים?</p>
      <div class="choice-list" id="turnChoices">
        ${options.map((o,i)=>`<button type="button" class="choice-opt" data-i="${i}">${o}</button>`).join('')}
      </div>
      <div class="reveal-box" id="turnReveal">איזו תגובה הייתה גורמת לך להרגיש שהשני באמת איתך? דברו על זה יחד — אין תשובה "נכונה", יש רק מה שעובד ביניכם.</div>
      <div class="btn-row"><button class="btn-primary" id="nextBtn">לתחנה הבאה</button></div>
      ${backLink()}
    </div>`;
}
function wireGameTurn(){
  document.getElementById('turnChoices').addEventListener('click', (e)=>{
    const opt = e.target.closest('.choice-opt');
    if(!opt) return;
    document.querySelectorAll('#turnChoices .choice-opt').forEach(o=>o.classList.remove('picked'));
    opt.classList.add('picked');
    document.getElementById('turnReveal').classList.add('show');
  });
}

/* Station 4: Accepting Influence */
function gameInfluenceHtml(){
  return `
    <div class="card-screen">
      <div class="eyebrow">משחק: בוא נחליף צדדים</div>
      <div class="prompt-box">יש לכם ערב פנוי.<br>אחד רוצה לצאת. השני רוצה להישאר בבית.</div>
      <p class="body-text center">כל אחד בוחר בשקט מה הוא היה מעדיף:</p>
      <div class="btn-row row-inline" style="justify-content:center;gap:12px;">
        <button type="button" class="choice-opt" id="prefOut" style="flex:1;text-align:center;">לצאת</button>
        <button type="button" class="choice-opt" id="prefStay" style="flex:1;text-align:center;">להישאר בבית</button>
      </div>
      <div class="reveal-box" id="influenceReveal">
        <strong>עכשיו תחליפו צדדים.</strong> כל אחד מנסה להסביר בקול: "למה אני מבין/ה את הצד של בן/בת הזוג שלי" — לא כדי להחליט מי צודק, אלא כדי לתרגל סקרנות כלפי נקודת המבט של השני.
      </div>
      <div class="btn-row"><button class="btn-secondary" id="influenceSwapBtn">בחרנו, עכשיו תחליפו צדדים</button></div>
      <div class="btn-row"><button class="btn-primary" id="nextBtn">לתחנה הבאה</button></div>

}
function wireGameInfluence(){
  const mark = (id)=>{
    document.getElementById('prefOut').classList.remove('picked');
    document.getElementById('prefStay').classList.remove('picked');
    document.getElementById(id).classList.add('picked');
  };
  document.getElementById('prefOut').addEventListener('click', ()=>mark('prefOut'));
  document.getElementById('prefStay').addEventListener('click', ()=>mark('prefStay'));
  document.getElementById('influenceSwapBtn').addEventListener('click', ()=>{
    document.getElementById('influenceReveal').classList.add('show');
  });
}

/* Station 7: Shared Meaning */
const MEANING_CHIPS = [
  "צוחקים הרבה", "מארחים חברים", "עוזרים אחד לשני", "שומרים על מסורת",
  "לומדים תורה ביחד", "יוצאים להרפתקאות", "אוהבים לבשל יחד", "תמיד אומרים תודה",
  "זוכרים לחגוג דברים קטנים", "נותנים מקום לשקט", "מדברים על הרגשות", "סומכים אחד על השני"
];
let meaningPicked = [];
function gameMeaningHtml(){
  return `
    <div class="card-screen">
      <div class="eyebrow">משחק: הבית שאנחנו בונים</div>
      <p class="body-text center">כל אחד עונה קודם בעצמו, בקול:</p>
      <div class="meaning-cats">
        <div class="cat"><div class="cat-title">🕯️ הטקסים שלנו</div><div class="cat-q">איזה דבר קטן היינו רוצים שיהיה "שלנו"?</div></div>
        <div class="cat"><div class="cat-title">🎯 המטרות שלנו</div><div class="cat-q">מה היינו רוצים להשיג יחד?</div></div>
        <div class="cat"><div class="cat-title">❤️ הערכים שלנו</div><div class="cat-q">איזה דבר חשוב לנו שיהיה נוכח בבית שלנו?</div></div>
        <div class="cat"><div class="cat-title">🌱 החלומות שלנו</div><div class="cat-q">מה אנחנו רוצים לחוות או לבנות ביחד?</div></div>
      </div>
      <p class="body-text center" style="font-weight:700;color:var(--navy);">עכשיו בואו נבנה תשובה משותפת — בחרו 2 עד 4 מילים:</p>
      <div class="chip-row" id="meaningChips">
        ${MEANING_CHIPS.map((c,i)=>`<button type="button" class="chip" data-i="${i}">${c}</button>`).join('')}
      </div>
      <div class="sentence-preview" id="meaningPreview">הבית שלנו הוא בית שבו...</div>
      <div class="btn-row"><button class="btn-primary" id="nextBtn">לתחנה הבאה</button></div>
      ${backLink()}
    </div>`;
}
function wireGameMeaning(){
  meaningPicked = [];
  document.getElementById('meaningChips').addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    const i = parseInt(chip.dataset.i, 10);
    const idx = meaningPicked.indexOf(i);
    if(idx >= 0){
      meaningPicked.splice(idx,1);
      chip.classList.remove('picked');
    } else {
      if(meaningPicked.length >= 4) return;
      meaningPicked.push(i);
      chip.classList.add('picked');
    }
    const words = meaningPicked.map(k => MEANING_CHIPS[k]);
    const preview = document.getElementById('meaningPreview');
    preview.textContent = words.length
      ? 'הבית שלנו הוא בית שבו ' + words.join(', ') + '.'
      : 'הבית שלנו הוא בית שבו...';
  });
}

render();
