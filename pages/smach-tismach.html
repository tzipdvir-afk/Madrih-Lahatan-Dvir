<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>שמח תשמח — המדריך לחתן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E8; --bg-alt:#EFE7D8; --card:#FFFDF8; --navy:#1F2A44; --navy-soft:#3A4766;
    --gold:#C9A227; --gold-soft:#E4C878; --text:#2B2620; --muted:#8a8272; --line:#E3D9C4;
    --shadow: 0 8px 24px rgba(43,38,32,0.10); --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  img{max-width:100%; display:block;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg-alt), transparent), var(--bg);
    color:var(--text); font-family:'Heebo',sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased; padding-bottom:40px; line-height:1.7;
  }
  h1,h2{ font-family:'Frank Ruhl Libre', serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 8px; }
  a.back-link{ display:inline-block; color:var(--navy-soft); text-decoration:none; font-size:14px; margin-bottom:14px; }
  a.back-link:hover{ text-decoration:underline; }
  header.app-header{ display:flex; flex-direction:column; gap:8px; padding:6px 4px 18px; text-align:center; }
  .eyebrow{ font-size:12px; letter-spacing:0.14em; color:var(--gold); font-weight:600; }
  header.app-header h1{ font-size:30px; margin:0; color:var(--navy); font-weight:700; }
  header.app-header p.sub{ margin:0; color:var(--muted); font-size:14.5px; }
  .hero{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; margin-bottom:20px; padding:10px;
  }
  .hero img{ width:100%; border-radius:14px; }
  .soon-card{
    text-align:center; background:var(--card); border:1.5px dashed var(--line);
    border-radius:var(--radius); padding:26px 20px; color:var(--muted);
  }
  .soon-card strong{ display:block; color:var(--navy); font-size:1.05rem; margin-bottom:4px; }
  footer.page-footer{ text-align:center; color:var(--muted); font-size:.82rem; padding:22px 12px 0; }
  [hidden]{ display:none !important; }

  .yt-card{
    display:flex; gap:12px; align-items:stretch; background:var(--card);
    border-radius:16px; box-shadow:var(--shadow); border:1px solid rgba(43,38,32,0.05);
    padding:10px; margin-bottom:12px;
  }
  .yt-thumb{
    position:relative; flex:none; width:128px; aspect-ratio:16/9; border:0; padding:0;
    border-radius:10px; overflow:hidden; cursor:pointer; background:#000;
    align-self:flex-start;
  }
  .yt-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .yt-play{
    position:absolute; inset:0; margin:auto; width:36px; height:36px; border-radius:50%;
    background:rgba(31,42,68,.6); border:1.5px solid rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center;
  }
  .yt-play::after{
    content:''; margin-left:3px;
    border-style:solid; border-width:7px 0 7px 11px; border-color:transparent transparent transparent #fff;
  }
  .yt-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .yt-title{ font-weight:700; color:var(--navy); font-size:15px; line-height:1.35; }
  .yt-desc{ font-size:13px; color:var(--muted); line-height:1.45; }
  .yt-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  .yt-btn{
    font-family:'Heebo',sans-serif; font-size:12.5px; font-weight:700; text-decoration:none; cursor:pointer;
    border-radius:999px; padding:6px 12px; border:1.5px solid var(--line); background:transparent; color:var(--navy);
  }
  .yt-btn.primary{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .sec-title{ font-size:1.15rem; color:var(--navy); margin:22px 2px 12px; }
  .clips{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
  .clips video{
    width:min(250px, 100%); aspect-ratio:9/16; background:#000; border-radius:14px;
    box-shadow:var(--shadow); object-fit:contain;
  }
  .pics{ display:grid; grid-template-columns:1fr; gap:14px; }
  .pic{
    padding:0; border:0; background:var(--card); border-radius:16px; overflow:hidden; cursor:zoom-in;
    box-shadow:var(--shadow); border:1px solid rgba(43,38,32,0.05);
  }
  .pic img{ width:100%; display:block; }
  .lb{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.88);
    display:flex; align-items:center; justify-content:center; padding:14px; cursor:zoom-out;
  }
  .lb img{ max-width:100%; max-height:100%; border-radius:8px; }

  /* חלון יוטיוב צף */
  .fpl{
    position:fixed; z-index:50; left:12px; bottom:12px; width:min(330px, calc(100vw - 24px));
    background:#111; border-radius:14px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.15);
  }
  .fpl-bar{ display:flex; align-items:center; gap:4px; padding:4px 8px 4px 4px; background:#1b1b1b; }
  .fpl-title{ flex:1; min-width:0; color:#eee; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 6px; }
  .fpl-btn{
    flex:none; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    color:#fff; background:transparent; border:0; border-radius:8px; cursor:pointer; text-decoration:none; font-size:15px;
  }
  .fpl-btn:hover{ background:rgba(255,255,255,.14); }
  .fpl-frame{ aspect-ratio:16/9; background:#000; }
  .fpl-frame iframe{ width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="../index.html">→ חזרה לדף הבית</a>

  <header class="app-header">
    <div class="eyebrow">הדרכת חתנים</div>
    <h1>שמח תשמח</h1>
    <p class="sub">קצת צחוק בתוך הקשר</p>
  </header>

  <div class="hero">
    <img src="../media/images/smach-tismach-hero.jpeg" alt="זוג צוחק יחד מול הטלפון">
  </div>

  <h2 class="sec-title">🎬 סרטונים</h2>
  <div id="items"></div>

  <div class="clips">
    <video src="../media/videos/smach-3.mp4#t=0.5" controls playsinline preload="metadata"></video>
    <video src="../media/videos/smach-4.mp4#t=0.5" controls playsinline preload="metadata"></video>
  </div>

  <h2 class="sec-title">🖼️ תמונות</h2>
  <div class="pics">
    <button type="button" class="pic" data-src="../media/images/smach-1.jpeg"><img src="../media/images/smach-1.jpeg" alt="שלט: סגולה לאריכות ימים לומר: את צודקת" loading="lazy" decoding="async"></button>
    <button type="button" class="pic" data-src="../media/images/smach-2.jpeg"><img src="../media/images/smach-2.jpeg" alt="כשהיא אומרת אני מעדיפה שלא אבל תעשה מה שאתה רוצה" loading="lazy" decoding="async"></button>
  </div>

  <div class="soon-card" id="soonCard" hidden>
    <strong>בקרוב</strong>
    כאן יופיעו קישורים ותמונות משעשעים.
  </div>

  <div class="lb" id="lb" hidden><img id="lbImg" alt=""></div>

  <footer class="page-footer">
    המדריך נועד ללימוד עצמי ולליווי הדרכת חתנים בלבד.
  </footer>

</div>

<!-- חלון יוטיוב צף: ממשיך לנגן בזמן שגוללים ברשימה -->
<div class="fpl" id="fpl" hidden>
  <div class="fpl-bar">
    <span class="fpl-title" id="fplTitle"></span>
    <a class="fpl-btn" id="fplOpen" href="#" target="_blank" rel="noopener noreferrer" title="פתיחה ביוטיוב" aria-label="פתיחה ביוטיוב">↗</a>
    <button class="fpl-btn" id="fplClose" type="button" title="סגירה" aria-label="סגירה">✕</button>
  </div>
  <div class="fpl-frame"><iframe id="fplFrame" title="נגן יוטיוב" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
</div>

<script>
/* להוספת סרטון: שורה חדשה כאן. id = המזהה שבקישור היוטיוב (אחרי v=), או אחרי youtu.be/ */
var ITEMS = [
  { id:'3XjUFYxSxDk', title:'מארק גנגור על מוח גברי ונשי' },
  // { id:'XXXXXXXXXXX', title:'שם הסרטון', desc:'משפט קצר (לא חובה)' },
];

(function(){
  var itemsEl = document.getElementById('items');
  var soon = document.getElementById('soonCard');
  var fpl = document.getElementById('fpl');
  var frame = document.getElementById('fplFrame');

  function openPlayer(it){
    document.getElementById('fplTitle').textContent = it.title;
    document.getElementById('fplOpen').href = 'https://www.youtube.com/watch?v=' + it.id;
    frame.src = 'https://www.youtube-nocookie.com/embed/' + it.id + '?autoplay=1&rel=0&playsinline=1';
    fpl.hidden = false;
  }
  function closePlayer(){
    frame.src = 'about:blank';
    fpl.hidden = true;
  }
  document.getElementById('fplClose').addEventListener('click', closePlayer);

  /* תמונות: הגדלה בלחיצה */
  var lb = document.getElementById('lb');
  Array.prototype.forEach.call(document.querySelectorAll('.pic'), function(p){
    p.addEventListener('click', function(){ document.getElementById('lbImg').src = p.getAttribute('data-src'); lb.hidden = false; });
  });
  lb.addEventListener('click', function(){ lb.hidden = true; });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') lb.hidden = true; });

  /* סרטונים מקומיים: נגן אחד בכל פעם */
  var clips = Array.prototype.slice.call(document.querySelectorAll('.clips video'));
  clips.forEach(function(v){
    v.addEventListener('play', function(){
      clips.forEach(function(o){ if (o !== v) o.pause(); });
      if (!fpl.hidden) closePlayer();
    });
  });

  if (!ITEMS.length && !clips.length) soon.hidden = false;
  ITEMS.forEach(function(it){
    var card = document.createElement('div');
    card.className = 'yt-card';
    var thumb = document.createElement('button');
    thumb.type = 'button'; thumb.className = 'yt-thumb';
    thumb.setAttribute('aria-label', 'צפייה בחלון צף: ' + it.title);
    thumb.innerHTML = '<img loading="lazy" decoding="async" alt="" src="https://i.ytimg.com/vi/' + it.id + '/hqdefault.jpg"><span class="yt-play"></span>';
    thumb.addEventListener('click', function(){ openPlayer(it); });
    var info = document.createElement('div');
    info.className = 'yt-info';
    var t = document.createElement('div'); t.className = 'yt-title'; t.textContent = it.title;
    info.appendChild(t);
    if (it.desc){ var d = document.createElement('div'); d.className = 'yt-desc'; d.textContent = it.desc; info.appendChild(d); }
    var acts = document.createElement('div'); acts.className = 'yt-actions';
    var watch = document.createElement('button');
    watch.type = 'button'; watch.className = 'yt-btn primary'; watch.textContent = '▶ צפייה בחלון צף';
    watch.addEventListener('click', function(){ openPlayer(it); });
    var ext = document.createElement('a');
    ext.className = 'yt-btn'; ext.textContent = 'ביוטיוב ↗';
    ext.href = 'https://www.youtube.com/watch?v=' + it.id; ext.target = '_blank'; ext.rel = 'noopener noreferrer';
    acts.appendChild(watch); acts.appendChild(ext);
    info.appendChild(acts);
    card.appendChild(thumb); card.appendChild(info);
    itemsEl.appendChild(card);
  });
})();
</script>
</body>
</html>
