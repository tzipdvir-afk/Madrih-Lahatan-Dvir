<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>כלים לתקשורת זוגית — המדריך לחתן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E8;
    --bg-alt:#EFE7D8;
    --card:#FFFDF8;
    --navy:#1F2A44;
    --navy-soft:#3A4766;
    --gold:#C9A227;
    --gold-soft:#E4C878;
    --text:#2B2620;
    --muted:#8a8272;
    --line:#E3D9C4;
    --shadow: 0 8px 24px rgba(43,38,32,0.10);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  img{max-width:100%; display:block;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-alt), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Heebo',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1{ font-family:'Frank Ruhl Libre', serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 8px; }

  a.back-link{
    display:inline-block;
    color:var(--navy-soft);
    text-decoration:none;
    font-size:14px;
    margin-bottom:14px;
  }
  a.back-link:hover{ text-decoration:underline; }

  header.app-header{
    display:flex; flex-direction:column; gap:8px;
    padding:6px 4px 24px; text-align:center;
  }
  .eyebrow{
    font-size:12px; letter-spacing:0.14em; color:var(--gold); font-weight:600;
  }
  header.app-header h1{ font-size:28px; margin:0; color:var(--navy); font-weight:700; }
  header.app-header p.sub{ margin:0; color:var(--muted); font-size:14.5px; }

  .video-frame{
    background:#000;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-bottom:22px;
  }
  video{ width:100%; display:block; }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }

  a.topic-card{
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    color:inherit;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid rgba(43,38,32,0.05);
    padding:0;
    transition:transform .15s ease;
  }
  a.topic-card:active{ transform:scale(0.98); }

  .topic-card .thumb{
    width:110px;
    height:110px;
    object-fit:cover;
    flex:none;
    background:var(--bg-alt);
  }
  .topic-card .info{
    flex:1;
    padding:14px 16px 14px 8px;
  }
  .topic-card .info .label{
    font-weight:700;
    font-size:16px;
    color:var(--navy);
    margin-bottom:4px;
  }
  .topic-card .info .desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
  }

  .topic-card.soon{
    opacity:0.55;
    pointer-events:none;
    position:relative;
  }
  .topic-card.soon .soon-badge{
    position:absolute;
    top:8px;
    left:8px;
    background:var(--navy);
    color:#fff;
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="../index.html">→ חזרה לדף הבית</a>

  <header class="app-header">
    <div class="eyebrow">הדרכת חתנים</div>
    <h1>כלים לתקשורת זוגית</h1>
    <p class="sub">שפה משותפת לזוגיות בריאה</p>
  </header>

  <div class="video-frame">
    <video controls preload="metadata" playsinline>
      <source src="../media/videos/tikshoret.mp4" type="video/mp4">
      הדפדפן שלכם לא תומך בהצגת וידאו מוטמע.
    </video>
  </div>

  <div class="grid">

    <a class="topic-card" href="love-languages.html">
      <img class="thumb" src="../media/images/home-tikshoret.jpeg" alt="חמש שפות האהבה">
      <div class="info">
        <div class="label">חמש שפות האהבה</div>
        <div class="desc">מאמר + משחק שאלות זוגי</div>
      </div>
    </a>

    <a class="topic-card" href="gottman.html">
      <img class="thumb" src="../media/images/home-gottman.jpeg" alt="שבעת העקרונות">
      <div class="info">
        <div class="label">שבעת העקרונות</div>
        <div class="desc">משחק זוגי בהשראת ג'ון גוטמן</div>
      </div>
    </a>

    <a class="topic-card" href="help-check.html">
      <img class="thumb" src="../media/images/help-check-intro.jpeg" alt="האם כדאי לנו לקבל עזרה זוגית?">
      <div class="info">
        <div class="label">האם כדאי לנו לקבל עזרה זוגית?</div>
        <div class="desc">כלי התבוננות מבוסס מחקר</div>
      </div>
    </a>

    <a class="topic-card soon" href="#" tabindex="-1" aria-disabled="true">
      <span class="soon-badge">בקרוב</span>
      <div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:36px;">📅</div>
      <div class="info">
        <div class="label">שימור האהבה</div>
        <div class="desc">דייט שבועי ונופש שנתי</div>
      </div>
    </a>

    <a class="topic-card soon" href="#" tabindex="-1" aria-disabled="true">
      <span class="soon-badge">בקרוב</span>
      <div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:36px;">🔺</div>
      <div class="info">
        <div class="label">משולשי האהבה</div>
        <div class="desc">התיאוריה של סטרנברג</div>
      </div>
    </a>

  </div>

</div>
</body>
</html>
