<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>המדריך לחתן</title>
<meta property="og:title" content="המדריך לחתן">
<meta property="og:description" content="הדרכת חתנים לקראת החתונה — כתמים, וסתות, הרחקות ועוד">
<meta property="og:image" content="https://dvir-hadraha.netlify.app/media/images/og-couple.jpg">
<meta property="og:url" content="https://dvir-hadraha.netlify.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E8;
    --bg-alt:#EFE7D8;
    --card:#FFFDF8;
    --navy:#1F2A44;
    --navy-soft:#3A4766;
    --gold:#C9A227;
    --gold-soft:#E4C878;
    --text:#2B2620;
    --muted:#8a8272;
    --line:#E3D9C4;
    --shadow: 0 8px 24px rgba(43,38,32,0.10);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  img{max-width:100%; display:block;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-alt), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Heebo',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1,h2,.display{ font-family:'Frank Ruhl Libre', serif; }

  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 16px 8px;
  }

  header.app-header{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:6px 4px 30px;
    text-align:center;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--gold);
    font-weight:600;
  }
  header.app-header h1{
    font-size:32px;
    margin:0;
    color:var(--navy);
    font-weight:700;
  }
  header.app-header p.sub{
    margin:0;
    color:var(--muted);
    font-size:14.5px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  a.topic-card.featured{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    gap:16px;
    border:1px solid rgba(201,162,39,0.35);
  }
  a.topic-card.featured .thumb{
    width:120px;
    aspect-ratio:1/1;
    flex:none;
  }
  a.topic-card.featured .label{
    flex:1;
    text-align:right;
    padding:0 14px 0 0;
    font-size:17px;
  }

  a.topic-card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid rgba(43,38,32,0.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.topic-card:active{ transform:scale(0.97); }

  .topic-card .thumb{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:var(--bg-alt);
  }
  .topic-card .label{
    padding:12px 10px 14px;
    text-align:center;
    font-weight:600;
    font-size:15px;
    color:var(--navy);
    line-height:1.35;
  }

  .topic-card.soon{
    opacity:0.55;
    pointer-events:none;
    position:relative;
  }
  .topic-card.soon .soon-badge{
    position:absolute;
    top:8px;
    left:8px;
    background:var(--navy);
    color:#fff;
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    font-weight:600;
  }

  footer.app-footer{
    text-align:center;
    margin-top:32px;
    font-size:12.5px;
    color:var(--muted);
  }
  footer.app-footer a{
    color:var(--navy-soft);
    display:inline-flex;
    align-items:center;
    gap:5px;
    vertical-align:middle;
  }
  footer.app-footer a svg{
    width:16px;height:16px;
    fill:#25D366;
    flex:none;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <div class="eyebrow">הדרכת חתנים</div>
    <h1>המדריך לחתן</h1>
    <p class="sub">בחרו נושא כדי להתחיל</p>
  </header>

  <div class="grid">

    <a class="topic-card featured" href="pages/hadracha.html">
      <img class="thumb" src="media/images/home-hadracha.jpeg" alt="הדרכת חתנים">
      <div class="label">הדרכת חתנים</div>
    </a>

    <a class="topic-card" href="pages/tahara-cycle.html?topic=cycle">
      <img class="thumb" src="media/images/home-tahara-cycle.jpeg" alt="מעגל הטהרה">
      <div class="label">מעגל הטהרה</div>
    </a>

    <a class="topic-card" href="pages/ketamim.html">
      <img class="thumb" src="media/images/home-ketamim.jpeg" alt="הלכות כתמים">
      <div class="label">הלכות כתמים</div>
    </a>

    <a class="topic-card soon" href="#" tabindex="-1" aria-disabled="true">
      <span class="soon-badge">בקרוב</span>
      <img class="thumb" src="media/images/home-tahara-process.jpeg" alt="תהליך הטהרה">
      <div class="label">תהליך הטהרה</div>
    </a>

    <a class="topic-card" href="pages/tahara-cycle.html?topic=vesatot">
      <img class="thumb" src="media/images/home-vesatot.jpeg" alt="הלכות וסתות">
      <div class="label">הלכות וסתות</div>
    </a>

    <a class="topic-card" href="pages/harchakot.html">
      <img class="thumb" src="media/images/home-harchakot.jpeg" alt="דיני הרחקות">
      <div class="label">דיני הרחקות</div>
    </a>

  </div>

  <footer class="app-footer">
    שאלות? <a href="https://wa.me/972528990131" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.001 3C9.107 3 3.5 8.607 3.5 15.5c0 2.3.62 4.46 1.7 6.32L3 29l7.36-2.15a12.44 12.44 0 0 0 5.64 1.36h.005C22.9 28.21 28.5 22.6 28.5 15.71 28.5 8.82 22.9 3.21 16.001 3zm0 22.7h-.004a10.4 10.4 0 0 1-5.3-1.46l-.38-.23-3.94 1.15 1.08-3.84-.25-.4a10.35 10.35 0 0 1-1.58-5.42c0-5.75 4.68-10.43 10.43-10.43 2.79 0 5.4 1.09 7.37 3.06a10.33 10.33 0 0 1 3.05 7.35c0 5.75-4.68 10.22-10.42 10.22zm5.72-7.62c-.31-.16-1.85-.91-2.14-1.02-.29-.1-.5-.16-.71.16-.21.31-.81 1.02-1 1.23-.18.21-.37.23-.68.08-.31-.16-1.32-.49-2.51-1.56-.93-.83-1.56-1.85-1.74-2.16-.18-.31-.02-.48.14-.63.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.1-.21.05-.39-.03-.55-.08-.16-.71-1.72-.97-2.35-.26-.62-.52-.54-.71-.55h-.6c-.21 0-.55.08-.84.39s-1.1 1.08-1.1 2.63 1.13 3.05 1.29 3.26c.16.21 2.22 3.4 5.39 4.77.75.32 1.34.52 1.8.66.76.24 1.45.21 1.99.13.61-.09 1.85-.76 2.11-1.49.26-.73.26-1.36.18-1.49-.08-.13-.29-.21-.6-.37z"/></svg>כתבו לנו בוואטסאפ</a>
  </footer>

</div>
</body>
</html>
